name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore permanent signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.WORKTRAIL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/worktrail-signing.jks"
          fi
      - name: Build debug APK
        env:
          WORKTRAIL_SIGNING_FILE: ${{ runner.temp }}/worktrail-signing.jks
          WORKTRAIL_STORE_PASSWORD: ${{ secrets.WORKTRAIL_STORE_PASSWORD }}
          WORKTRAIL_SIGNING_ALIAS: ${{ secrets.WORKTRAIL_SIGNING_ALIAS }}
          WORKTRAIL_KEY_PASSWORD: ${{ secrets.WORKTRAIL_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: WorkTrail-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
